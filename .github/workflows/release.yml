name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests
        shell: bash
        run: pytest -q --junitxml=report.xml || { python scripts/junit_annotate.py report.xml; exit 1; }
      - name: Release notes from CHANGELOG.md (fails if this version has no entry)
        shell: bash
        run: PYTHONIOENCODING=utf-8 python -m pmkt_alert.changelog "${{ github.ref_name }}" > notes.md && cat notes.md
      - name: Stamp version
        shell: bash
        run: |
          v="${{ github.ref_name }}"
          echo "VERSION = \"${v#v}\"" > src/pmkt_alert/_version.py
          cat src/pmkt_alert/_version.py
      - name: Build exe
        env:
          APP_NAME: PMKT-Alert
        run: pyinstaller --noconfirm pmkt_alert.spec
      - name: Self-check built exe
        run: |
          $exe = (Get-ChildItem dist\*.exe).FullName
          $p = Start-Process -FilePath $exe -ArgumentList "--selfcheck" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selfcheck failed: UI not bundled" }
      - name: Checksum
        shell: bash
        run: |
          cd dist
          for f in *.exe; do sha256sum "$f" | sed 's/ \*/  /' > "$f.sha256"; cat "$f.sha256"; done
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} (Get-ChildItem dist\*.exe, dist\*.sha256).FullName --title "PMKT Alert ${{ github.ref_name }}" --notes-file notes.md
